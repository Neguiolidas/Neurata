[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurata"
description = "The living knowledge layer for an agent's environment: deposit raw, curate quietly, retrieve at the right moment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Neguiolidas / Neguitech" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "bandit", "vulture"]

[project.scripts]
neurata = "neurata.cli:main"
neu = "neurata.cli:main"

[tool.setuptools]
packages = ["neurata"]

[tool.setuptools.dynamic]
version = { attr = "neurata.__version__" }

# ── pyright (type checker — substitui mypy) ─────────────────────────
[tool.pyright]
include = ["neurata"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "error"
reportOptionalMemberAccess = "error"
reportIncompatibleMethodOverride = "warning"
reportMissingImports = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

# ── bandit (security linter) ────────────────────────────────────────
[tool.bandit]
targets = ["neurata"]
severity = "medium"
confidence = "medium"
skips = [
  "B101",  # assert_used — pytest usa assert natural
]

# ── vulture (dead code finder) ──────────────────────────────────────
[tool.vulture]
paths = ["neurata"]
min_confidence = 60
