[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurata"
description = "The living knowledge layer for an agent's environment: deposit raw, curate quietly, retrieve at the right moment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Neguiolidas / Neguitech" }]
dynamic = ["version"]
dependencies = []
keywords = ["knowledge-base", "notes", "cli", "agent", "memory", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Linters presos ao minor. Sem teto, um release do linter reprova código
# que não mudou — e o CI fica vermelho sem commit culpado. Subir a faixa
# é ato deliberado, com o diff de regras novas na mão.
dev = [
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
  "pyright>=1.1.400,<2",
  "bandit>=1.8,<2",
  "vulture>=2.14,<3",
]

[project.scripts]
neurata = "neurata.cli:main"
neu = "neurata.cli:main"

[project.urls]
Homepage = "https://github.com/Neguiolidas/Neurata"
Repository = "https://github.com/Neguiolidas/Neurata"
Issues = "https://github.com/Neguiolidas/Neurata/issues"

[tool.setuptools]
packages = ["neurata"]

[tool.setuptools.dynamic]
version = { attr = "neurata.__version__" }

# ── ruff (linter) ───────────────────────────────────────────────────
# `select` explícito: sem ele o ruff usa o default DELE, que muda entre
# versões — foi assim que 49 erros apareceram em código que ninguém tocou.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle: imports, statements, sintaxe
  "F",               # pyflakes
  "I",               # ordem de import
  "UP",              # idiomas mortos pro floor 3.10
  "B",               # bugbear
  "BLE",             # except Exception cego — precisa ser declarado
  "SIM",             # simplificações
  "PLE", "PLW",      # pylint: erros e warnings
  "RUF",
]
ignore = [
  # RUF001/002/003 caçam homoglifo (caractere que finge ser ASCII) em
  # identificador, string e comentário. Aqui os comentários são prosa em
  # português: travessão e `×` são intencionais e vão continuar aparecendo.
  # Manter a regra seria fabricar noqa pra sempre.
  "RUF001", "RUF002", "RUF003",
]
# Fora de propósito, não por incômodo:
#   S    → bandit já cobre segurança (`bandit -r neurata/`); duas ferramentas
#          na mesma regra só produz noqa duplicado.
#   E5   → E501; comprimento de linha não é gate deste projeto.
#   PYI  → regras de arquivo `.pyi`; o repo não tem stubs.
#   PLR  → limiares de complexidade (nº de args, magic value): heurística.

# ── pyright (type checker — substitui mypy) ─────────────────────────
[tool.pyright]
include = ["neurata"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "error"
reportOptionalMemberAccess = "error"
reportIncompatibleMethodOverride = "warning"
reportMissingImports = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

# ── bandit (security linter) ────────────────────────────────────────
[tool.bandit]
targets = ["neurata"]
# `severity`/`confidence` moravam aqui e NÃO são chaves de config do
# bandit — só flags de CLI (-ll/-ii). Eram ignoradas em silêncio, e o
# gate real era mais rígido que o declarado. O filtro agora é explícito
# por teste, pra que `bandit -c pyproject.toml -r neurata/` dê o mesmo
# veredito nesta máquina e na CI.
skips = [
  "B101",  # assert_used — pytest usa assert natural
  # Chamamos `git` de propósito (snapshot/envelope), sempre com argv em
  # lista e nunca com `shell=True`. B602 (shell=True), que é o teste com
  # sinal de verdade, segue ligado — assim como B608 (SQL), dispensado
  # caso a caso no `query.py`.
  "B404",  # import subprocess
  "B603",  # subprocess sem shell=True — advisory genérico
  "B607",  # `git` pelo PATH em vez de caminho absoluto (portabilidade)
]

# ── vulture (dead code finder) ──────────────────────────────────────
[tool.vulture]
# `tests` entra no escopo porque quem LÊ os contadores de report
# (`renamed`, `reconciled`, `harvested`, `removed`, …) é a suíte. Com
# `paths = ["neurata"]` o vulture só via o `+= 1` e acusava 15 campos
# vivos como mortos — ruído que treina a gente a ignorar o gate.
paths = ["neurata", "tests"]
min_confidence = 60
# Fixtures são chamadas pelo pytest, não pelo código; e stubs plugados
# via monkeypatch precisam aceitar os parâmetros da função original
# mesmo sem usá-los. Nenhum dos dois é código morto.
ignore_decorators = ["@pytest.fixture"]
ignore_names = ["*_arg"]
