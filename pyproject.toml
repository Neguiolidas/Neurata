[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armarium"
description = "The living knowledge layer for an agent's environment. Claustrum sine armario quasi castrum sine armamentario."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Neguiolidas / Neguitech" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
armarium = "armarium.cli:main"
arma = "armarium.cli:main"

[tool.setuptools]
packages = ["armarium"]

[tool.setuptools.dynamic]
version = { attr = "armarium.__version__" }
