[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurata"
description = "The living knowledge layer for an agent's environment: deposit raw, curate quietly, retrieve at the right moment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Neguiolidas / Neguitech" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
neurata = "neurata.cli:main"
neu = "neurata.cli:main"

[tool.setuptools]
packages = ["neurata"]

[tool.setuptools.dynamic]
version = { attr = "neurata.__version__" }
