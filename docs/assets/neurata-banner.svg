<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 744" width="1320" height="744" role="img" aria-label="Neurata — the living knowledge layer for an agent's environment">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e17"/>
      <stop offset="0.55" stop-color="#0e1320"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b954" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#f5b954" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f5b954" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.45" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#c98a2e"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="0.6" stop-color="#cfd6e4"/>
      <stop offset="1" stop-color="#b9b6d8"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b95a"/>
      <stop offset="1" stop-color="#8f7bd8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1320" height="744" fill="url(#bg)"/>
  <path d="M 0 640 Q 420 520 760 660 T 1320 600 L 1320 744 L 0 744 Z" fill="#0a0d15" opacity="0.55"/>
  <path d="M 1320 0 Q 1040 130 1140 340 T 1320 520 Z" fill="#171f33" opacity="0.35"/>
  <circle cx="330" cy="372" r="330" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#e8ecf5">
    <circle cx="640" cy="90" r="1.4" opacity="0.7"/>
    <circle cx="120" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="580" cy="620" r="1.3" opacity="0.6"/>
    <circle cx="90" cy="600" r="1.2" opacity="0.5"/>
    <circle cx="480" cy="60" r="1" opacity="0.45"/>
    <circle cx="700" cy="680" r="1.1" opacity="0.5"/>
    <circle cx="1240" cy="120" r="1.2" opacity="0.4"/>
    <circle cx="1180" cy="660" r="1.3" opacity="0.45"/>
    <circle cx="960" cy="80" r="1" opacity="0.35"/>
    <circle cx="60" cy="360" r="1.1" opacity="0.4"/>
  </g>

  <!-- concentric rings -->
  <g fill="none" stroke="#e5c07b" opacity="0.18">
    <circle cx="330" cy="372" r="132" stroke-width="1"/>
    <circle cx="330" cy="372" r="196" stroke-width="1"/>
    <circle cx="330" cy="372" r="258" stroke-width="1"/>
    <circle cx="330" cy="372" r="308" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- edges -->
  <g stroke="#e9b45c" stroke-width="1.6" opacity="0.55" filter="url(#glow)" fill="none">
    <path d="M 330 372 L 450 340"/>
    <path d="M 330 372 L 390 262"/>
    <path d="M 330 372 L 250 272"/>
    <path d="M 330 372 L 216 420"/>
    <path d="M 330 372 L 300 480"/>
    <path d="M 330 372 L 430 455"/>
    <path d="M 450 340 L 545 302"/>
    <path d="M 450 340 L 482 184"/>
    <path d="M 390 262 L 482 184"/>
    <path d="M 390 262 L 330 132"/>
    <path d="M 250 272 L 330 132"/>
    <path d="M 250 272 L 172 172"/>
    <path d="M 250 272 L 108 322"/>
    <path d="M 216 420 L 108 322"/>
    <path d="M 216 420 L 122 470"/>
    <path d="M 300 480 L 232 568"/>
    <path d="M 300 480 L 400 588"/>
    <path d="M 430 455 L 540 500"/>
    <path d="M 430 455 L 574 402"/>
    <path d="M 545 302 L 574 402"/>
    <path d="M 122 470 L 232 568"/>
    <path d="M 482 184 L 545 302"/>
    <path d="M 172 172 L 108 322" opacity="0.35"/>
    <path d="M 400 588 L 540 500" opacity="0.35"/>
  </g>

  <!-- outer nodes -->
  <g filter="url(#glow)">
    <circle cx="545" cy="302" r="7" fill="#ffd98a"/>
    <circle cx="482" cy="184" r="6" fill="#f7cf7e"/>
    <circle cx="330" cy="132" r="7" fill="#ffd98a"/>
    <circle cx="172" cy="172" r="5.5" fill="#e9b45c"/>
    <circle cx="108" cy="322" r="6.5" fill="#f7cf7e"/>
    <circle cx="122" cy="470" r="5.5" fill="#e9b45c"/>
    <circle cx="232" cy="568" r="6.5" fill="#f7cf7e"/>
    <circle cx="400" cy="588" r="6" fill="#ffd98a"/>
    <circle cx="540" cy="500" r="6" fill="#f7cf7e"/>
    <circle cx="574" cy="402" r="5.5" fill="#e9b45c"/>
  </g>

  <!-- note nodes: small documents in the web -->
  <g filter="url(#glow)" stroke="#2a1f0d" stroke-width="0.8">
    <rect x="441" y="331" width="18" height="20" rx="3" fill="#ffe3a3"/>
    <rect x="381" y="252" width="18" height="20" rx="3" fill="#ffe3a3"/>
    <rect x="241" y="262" width="18" height="20" rx="3" fill="#ffe3a3"/>
    <rect x="207" y="410" width="18" height="20" rx="3" fill="#ffe3a3"/>
    <rect x="291" y="470" width="18" height="20" rx="3" fill="#ffe3a3"/>
    <rect x="421" y="445" width="18" height="20" rx="3" fill="#ffe3a3"/>
  </g>
  <g stroke="#7a5a1e" stroke-width="1.4" opacity="0.85">
    <path d="M 445 336 h 10 M 445 341 h 10 M 445 346 h 7"/>
    <path d="M 385 257 h 10 M 385 262 h 10 M 385 267 h 7"/>
    <path d="M 245 267 h 10 M 245 272 h 10 M 245 277 h 7"/>
    <path d="M 211 415 h 10 M 211 420 h 10 M 211 425 h 7"/>
    <path d="M 295 475 h 10 M 295 480 h 10 M 295 485 h 7"/>
    <path d="M 425 450 h 10 M 425 455 h 10 M 425 460 h 7"/>
  </g>

  <!-- core -->
  <circle cx="330" cy="372" r="40" fill="#f5b954" opacity="0.25" filter="url(#glowSoft)"/>
  <circle cx="330" cy="372" r="24" fill="url(#coreGrad)" filter="url(#glowSoft)"/>
  <circle cx="330" cy="372" r="24" fill="none" stroke="#fff2cf" stroke-width="1.2" opacity="0.8"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="688" y="382" font-size="118" font-weight="600" letter-spacing="2" fill="url(#titleGrad)">Neurata</text>
    <rect x="692" y="412" width="536" height="5" rx="2.5" fill="url(#ruleGrad)"/>
    <text x="692" y="466" font-size="31" font-weight="500" fill="#d7deea">The living memory of your environment</text>
    <text x="692" y="510" font-size="21" font-weight="500" letter-spacing="0.5" fill="#e8c47a">deposit raw&#160;&#160;·&#160;&#160;curate quietly&#160;&#160;·&#160;&#160;retrieve at the right moment</text>
  </g>
</svg>
