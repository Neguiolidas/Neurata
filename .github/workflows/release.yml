name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  guard:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: tag deve ser igual a __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import neurata; print(neurata.__version__)')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag != neurata.__version__ $ver — nada publicado"
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Última chance antes de um upload irreversível — o PyPI não deixa
  # republicar uma versão. De propósito sem checkout: sem o repositório em
  # disco, `import neurata` só pode resolver para o artefato instalado.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # o piso declarado
      - run: pip install dist/*.whl
      - name: A CLI publicada funciona
        env:
          NEURATA_HOME: ${{ runner.temp }}/nhome
        run: |
          python - <<'PY'
          import neurata
          assert "site-packages" in neurata.__file__, neurata.__file__
          import neurata.providers.formats.markdown
          PY
          test "$(neurata --version)" = "neurata ${GITHUB_REF_NAME#v}"
          neurata deposit "smoke pré-publicação" --title "Release" --json
          neurata tick --json
          neurata query "smoke" --json
          neurata doctor --json || test $? -le 1

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
