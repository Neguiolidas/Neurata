name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest tests/ -v

  # A suíte acima roda com `pip install -e .`, que põe a árvore inteira no
  # sys.path: um subpacote ausente do pyproject some do wheel sem deixar um
  # único teste vermelho. Este job instala o artefato de verdade e roda a CLI
  # FORA do repositório — dentro dele, `import neurata` acharia ./neurata/ e
  # o smoke passaria mesmo com o wheel quebrado.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # o piso declarado
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Metadata (o que o PyPI vai renderizar)
        run: twine check dist/*
      - name: Install do wheel, sem -e
        run: pip install dist/*.whl
      - name: Smoke fora do repositório
        working-directory: ${{ runner.temp }}
        env:
          NEURATA_HOME: ${{ runner.temp }}/nhome
        run: |
          python - <<'PY'
          import neurata
          assert "site-packages" in neurata.__file__, neurata.__file__
          import neurata.providers.formats.markdown  # o que faltava no wheel
          print("importado de", neurata.__file__)
          PY
          neurata --version
          neurata deposit "smoke do artefato publicado" --title "Wheel" --json
          neurata tick --json
          neurata query "smoke" --json
          neurata shelf --json
          # doctor sai 1 em warn (home recém-criado tem index-freshness);
          # o gate aqui é "não estourou", não "home impecável".
          neurata doctor --json || test $? -le 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Bandit
        run: bandit -c pyproject.toml -r neurata/
      - name: Vulture
        run: vulture
